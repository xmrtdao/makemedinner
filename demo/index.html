<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MakeMeDinner — Multimodal AI Cooking Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  h1 { font-size: 2.2rem; color: #ff6b35; margin-bottom: 0.3rem; }
  .subtitle { color: #aaa; margin-bottom: 1.5rem; }
  #camera-container {
    position: relative;
    width: 100%; max-width: 640px;
    aspect-ratio: 4/3;
    background: #1a1a1a;
    border: 2px dashed #444;
    border-radius: 12px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .placeholder-text { color: #666; text-align: center; padding: 2rem; }
  .btn {
    background: #ff6b35;
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    margin: 0.5rem;
    transition: background 0.2s;
  }
  .btn:hover { background: #e55a2b; }
  .btn.secondary { background: #333; }
  .btn.secondary:hover { background: #444; }
  #controls { margin-top: 1rem; display: flex; flex-wrap: wrap; justify-content: center; }
  #results {
    width: 100%; max-width: 640px;
    margin-top: 1.5rem;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 1.5rem;
    display: none;
  }
  .section-title { font-size: 1.1rem; color: #ff6b35; margin-bottom: 0.75rem; }
  .ingredient-tag {
    display: inline-block;
    background: #2a2a2a;
    border: 1px solid #444;
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    margin: 0.25rem;
    font-size: 0.9rem;
  }
  .confidence { color: #888; font-size: 0.75rem; margin-left: 0.3rem; }
  .recipe-card {
    background: #222;
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1rem;
    border-left: 3px solid #ff6b35;
  }
  .recipe-title { font-weight: 600; color: #fff; margin-bottom: 0.3rem; }
  .recipe-meta { color: #888; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .recipe-steps { color: #ccc; font-size: 0.9rem; line-height: 1.5; }
  #loading {
    display: none;
    color: #ff6b35;
    margin-top: 1rem;
    font-style: italic;
  }
  .hidden-file-input { display: none; }
</style>
</head>
<body>
  <h1>MakeMeDinner</h1>
  <p class="subtitle">Point your camera at your fridge. We'll tell you what to cook.</p>

  <div id="camera-container">
    <p class="placeholder-text" id="placeholder">Camera off. Use buttons below to start.</p>
    <video id="video" autoplay playsinline></video>
    <img id="preview-img" alt="captured" />
  </div>

  <div id="controls">
    <button class="btn" id="btn-start">Start Camera</button>
    <button class="btn secondary" id="btn-snap">Snap Photo</button>
    <button class="btn secondary" id="btn-upload">Upload Photo</button>
    <button class="btn secondary" id="btn-reset">Reset</button>
  </div>

  <p id="loading">Scanning ingredients with vision AI...</p>

  <div id="results">
    <div class="section-title">Detected Ingredients</div>
    <div id="ingredients-list"></div>

    <div class="section-title" style="margin-top:1.5rem;">Suggested Recipes</div>
    <div id="recipes-list"></div>
  </div>

  <input type="file" id="file-input" class="hidden-file-input" accept="image/*" />

<script>
const video = document.getElementById('video');
const previewImg = document.getElementById('preview-img');
const placeholder = document.getElementById('placeholder');
const btnStart = document.getElementById('btn-start');
const btnSnap = document.getElementById('btn-snap');
const btnUpload = document.getElementById('btn-upload');
const btnReset = document.getElementById('btn-reset');
const loading = document.getElementById('loading');
const results = document.getElementById('results');
const ingredientsList = document.getElementById('ingredients-list');
const recipesList = document.getElementById('recipes-list');
const fileInput = document.getElementById('file-input');

let stream = null;

btnStart.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    video.style.display = 'block';
    previewImg.style.display = 'none';
    placeholder.style.display = 'none';
  } catch (e) {
    alert('Camera access denied or unavailable: ' + e.message);
  }
});

btnSnap.addEventListener('click', () => {
  if (!stream) { alert('Start camera first'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  showImage(dataUrl);
  processImage(dataUrl);
});

btnUpload.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    showImage(ev.target.result);
    processImage(ev.target.result);
  };
  reader.readAsDataURL(file);
});

btnReset.addEventListener('click', () => {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  previewImg.style.display = 'none';
  placeholder.style.display = 'block';
  results.style.display = 'none';
  loading.style.display = 'none';
});

function showImage(dataUrl) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  previewImg.src = dataUrl;
  previewImg.style.display = 'block';
  placeholder.style.display = 'none';
}

// Simulated vision + recipe pipeline for demo (replace with real API calls)
async function processImage(dataUrl) {
  loading.style.display = 'block';
  results.style.display = 'none';

  // In production, POST dataUrl to /scan-ingredients endpoint
  // Here we simulate a realistic ingredient detection result
  await new Promise(r => setTimeout(r, 1800));

  const detected = [
    { name: 'eggs', confidence: 0.97 },
    { name: 'tomatoes', confidence: 0.94 },
    { name: 'onion', confidence: 0.91 },
    { name: 'cheese', confidence: 0.88 },
    { name: 'spinach', confidence: 0.85 },
    { name: 'bell pepper', confidence: 0.72 },
  ];

  ingredientsList.innerHTML = detected.map(i =>
    `<span class="ingredient-tag">${i.name}<span class="confidence">${(i.confidence*100).toFixed(0)}%</span></span>`
  ).join('');

  const recipes = [
    {
      title: 'Veggie Omelette with Spinach',
      match: '96% match',
      time: '15 min',
      steps: '1. Dice tomatoes, onion, and bell pepper. 2. Whisk 3 eggs with salt and pepper. 3. Sauté veggies in butter for 3 min. 4. Pour eggs over veggies, add spinach and cheese. 5. Fold and cook 2 min each side.'
    },
    {
      title: 'Shakshuka (Eggs in Tomato Sauce)',
      match: '91% match',
      time: '25 min',
      steps: '1. Sauté diced onion and bell pepper until soft. 2. Add chopped tomatoes, cumin, paprika, simmer 10 min. 3. Make wells, crack eggs in. 4. Cover, cook 5-7 min until whites set. 5. Top with cheese if desired.'
    },
    {
      title: 'Spinach & Cheese Frittata',
      match: '89% match',
      time: '20 min',
      steps: '1. Preheat broiler. 2. Sauté onion, tomatoes, spinach in oven-safe pan. 3. Pour 4 beaten eggs over. 4. Cook 4 min stovetop, then broil 2 min. 5. Slice and serve warm.'
    }
  ];

  recipesList.innerHTML = recipes.map(r => `
    <div class="recipe-card">
      <div class="recipe-title">${r.title}</div>
      <div class="recipe-meta">${r.match} · ${r.time}</div>
      <div class="recipe-steps">${r.steps}</div>
    </div>
  `).join('');

  loading.style.display = 'none';
  results.style.display = 'block';
}
</script>
</body>
</html>
