<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ED1C24"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" letter-spacing="1">MAKE ME DINNER</text>
  <text x="450" y="68" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="3">VISION PIPELINE</text>

  <!-- Camera Input -->
  <rect x="20" y="120" width="160" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="20" y="120" width="160" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="100" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">CAMERA</text>
  <text x="100" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Webcam / Upload</text>
  <circle cx="100" cy="215" r="35" stroke="#ED1C24" stroke-width="2" fill="#1a1a1a" opacity="0.8"/>
  <circle cx="100" cy="215" r="20" fill="none" stroke="#ED1C24" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  <polygon points="90,205 100,225 110,205" fill="#ED1C24" opacity="0.6"/>

  <line x1="180" y1="190" x2="220" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Detection -->
  <rect x="230" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="230" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="315" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">DETECTION</text>
  <text x="315" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">YOLOv8 + CLIP</text>
  <rect x="255" y="190" width="50" height="45" fill="none" stroke="#ED1C24" stroke-width="1.5" rx="4"/>
  <rect x="265" y="200" width="30" height="25" fill="#ED1C24" opacity="0.15" rx="2"/>
  <rect x="325" y="185" width="60" height="55" fill="none" stroke="#ED1C24" stroke-width="1.5" rx="4"/>
  <rect x="335" y="195" width="40" height="30" fill="#ED1C24" opacity="0.2" rx="2"/>
  <text x="315" y="255" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="8">BBoxes</text>

  <line x1="400" y1="190" x2="440" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Recipe LLM -->
  <rect x="450" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="450" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="535" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">RECIPE LLM</text>
  <text x="535" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Mistral / Zephyr</text>
  <rect x="470" y="190" width="130" height="55" fill="#111" stroke="#333" stroke-width="1" rx="6"/>
  <text x="535" y="205" text-anchor="middle" fill="#cccccc" font-family="JetBrains Mono, monospace" font-size="8">1. Chop onions</text>
  <text x="535" y="218" text-anchor="middle" fill="#cccccc" font-family="JetBrains Mono, monospace" font-size="8">2. Sear steak</text>
  <text x="535" y="231" text-anchor="middle" fill="#cccccc" font-family="JetBrains Mono, monospace" font-size="8">3. Rest + serve</text>

  <line x1="620" y1="190" x2="660" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- TTS Output -->
  <rect x="670" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="670" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="755" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">TTS OUTPUT</text>
  <text x="755" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Piper / Coqui</text>
  <path d="M 715 225 L 725 215 L 725 235 Z" fill="#ED1C24" opacity="0.6"/>
  <circle cx="710" cy="225" r="16" fill="none" stroke="#ED1C24" stroke-width="1.5"/>
  <circle cx="710" cy="225" r="24" fill="none" stroke="#ED1C24" stroke-width="1" opacity="0.5"/>
  <circle cx="710" cy="225" r="32" fill="none" stroke="#ED1C24" stroke-width="0.8" opacity="0.3"/>
  <rect x="735" y="215" width="50" height="4" fill="#ED1C24" opacity="0.8" rx="2"/>
  <rect x="735" y="224" width="35" height="4" fill="#ED1C24" opacity="0.6" rx="2"/>
  <rect x="735" y="233" width="45" height="4" fill="#ED1C24" opacity="0.7" rx="2"/>

  <!-- Bottom Metrics -->
  <rect x="80" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="180" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">&lt; 3s</text>
  <text x="180" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">END-TO-END LATENCY</text>

  <rect x="310" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="410" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">93%+</text>
  <text x="410" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">INGREDIENT DETECTION</text>

  <rect x="540" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="640" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">REALTIME</text>
  <text x="640" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">TTS STREAMING</text>

  <!-- Footer -->
  <text x="450" y="400" text-anchor="middle" fill="#444" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">AMD MI300X + ROCm | XMRT DAO</text>
</svg>
